<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0c1226"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <radialGradient id="polyGlow" cx="730" cy="125" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Title Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Grid Horizon Fade -->
    <linearGradient id="horizonFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Laser Divider Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { opacity: 0.7; r: 6; }
      50% { opacity: 1; r: 9; }
    }
    .core-node {
      animation: pulseCore 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="900" height="280" fill="url(#bgGlow)"/>

  <!-- Star Field / Ambient Dust -->
  <g opacity="0.65">
    <circle cx="60" cy="35" r="1.2" fill="#00f5ff"/>
    <circle cx="140" cy="85" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="260" cy="25" r="1.1" fill="#ec4899"/>
    <circle cx="370" cy="60" r="1.3" fill="#00f5ff" opacity="0.7"/>
    <circle cx="490" cy="35" r="1.5" fill="#ffffff"/>
    <circle cx="590" cy="70" r="1.2" fill="#818cf8"/>
    <circle cx="860" cy="40" r="1.4" fill="#00f5ff"/>
    <circle cx="880" cy="95" r="1.1" fill="#ec4899"/>
    <circle cx="110" cy="140" r="1.0" fill="#ffffff" opacity="0.5"/>
    <circle cx="320" cy="120" r="1.3" fill="#818cf8" opacity="0.6"/>
  </g>

  <!-- Perspective Grid Floor (Horizon at Y=180) -->
  <g mask="url(#horizonMask)">
    <mask id="horizonMask">
      <rect x="0" y="170" width="900" height="110" fill="url(#horizonFade)"/>
    </mask>

    <!-- Transverse Lines -->
    <g stroke="#00f5ff" stroke-width="0.8" opacity="0.35">
      <line x1="0" y1="184" x2="900" y2="184"/>
      <line x1="0" y1="195" x2="900" y2="195"/>
      <line x1="0" y1="210" x2="900" y2="210"/>
      <line x1="0" y1="228" x2="900" y2="228"/>
      <line x1="0" y1="250" x2="900" y2="250"/>
      <line x1="0" y1="275" x2="900" y2="275"/>
    </g>

    <!-- Perspective Radians to Horizon Vanishing Point (cx=450, cy=180) -->
    <g stroke="#818cf8" stroke-width="0.9" opacity="0.4">
      <line x1="450" y1="180" x2="-80" y2="280"/>
      <line x1="450" y1="180" x2="60" y2="280"/>
      <line x1="450" y1="180" x2="170" y2="280"/>
      <line x1="450" y1="180" x2="270" y2="280"/>
      <line x1="450" y1="180" x2="360" y2="280"/>
      <line x1="450" y1="180" x2="450" y2="280" stroke="#00f5ff" opacity="0.65"/>
      <line x1="450" y1="180" x2="540" y2="280"/>
      <line x1="450" y1="180" x2="630" y2="280"/>
      <line x1="450" y1="180" x2="730" y2="280"/>
      <line x1="450" y1="180" x2="840" y2="280"/>
      <line x1="450" y1="180" x2="980" y2="280"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════
       3D WIREFRAME GYROSCOPIC HYPERCUBE (Right Side)
  ══════════════════════════════════════════════════════ -->
  <circle cx="730" cy="125" r="110" fill="url(#polyGlow)"/>

  <!-- Outer Ring with Continuous SMIL Rotation -->
  <g filter="url(#intenseGlow)">
    <g>
      <!-- Outer Icosahedron / Octahedron Polytope -->
      <g stroke="#00f5ff" stroke-width="1.3" opacity="0.8" fill="none">
        <polygon points="730,50 798,85 798,165 730,200 662,165 662,85"/>
        <line x1="730" y1="50" x2="730" y2="200"/>
        <line x1="662" y1="85" x2="798" y2="165"/>
        <line x1="662" y1="165" x2="798" y2="85"/>
        <line x1="730" y1="50" x2="760" y2="125"/>
        <line x1="730" y1="200" x2="700" y2="125"/>
        <line x1="662" y1="85" x2="760" y2="125"/>
        <line x1="798" y1="165" x2="700" y2="125"/>
      </g>
      <!-- Outer Poly Nodes -->
      <g fill="#00ffff">
        <circle cx="730" cy="50" r="3.2"/>
        <circle cx="798" cy="85" r="3.2"/>
        <circle cx="798" cy="165" r="3.2"/>
        <circle cx="730" cy="200" r="3.2"/>
        <circle cx="662" cy="165" r="3.2"/>
        <circle cx="662" cy="85" r="3.2"/>
      </g>
      <!-- SMIL Continuous Rotation Clockwise -->
      <animateTransform attributeName="transform" type="rotate"
                        from="0 730 125" to="360 730 125"
                        dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Inner Tesseract / Gyro Core Rotating Counter-Clockwise -->
  <g filter="url(#intenseGlow)">
    <g>
      <g stroke="#ec4899" stroke-width="1.2" opacity="0.85" fill="none">
        <polygon points="730,75 775,125 730,175 685,125"/>
        <line x1="730" y1="75" x2="730" y2="175" stroke="#ffffff" stroke-width="0.8"/>
        <line x1="685" y1="125" x2="775" y2="125" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <g fill="#f43f5e">
        <circle cx="730" cy="75" r="2.8"/>
        <circle cx="775" cy="125" r="2.8"/>
        <circle cx="730" cy="175" r="2.8"/>
        <circle cx="685" cy="125" r="2.8"/>
      </g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 730 125" to="0 730 125"
                        dur="16s" repeatCount="indefinite"/>
    </g>
    <!-- Central Pulsing Fusion Node -->
    <circle class="core-node" cx="730" cy="125" r="6" fill="#ffffff" filter="url(#intenseGlow)"/>
  </g>

  <!-- ══════════════════════════════════════════════════════
       LEFT SIDE: TYPOGRAPHY, TERMINAL PROMPT & BADGES
  ══════════════════════════════════════════════════════ -->
  <!-- 1. Code Terminal Prompt -->
  <g transform="translate(36, 44)">
    <text font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#00f5ff" letter-spacing="1">
      <tspan fill="#ec4899">&gt;</tspan> sys.boot<tspan fill="#818cf8">(</tspan><tspan fill="#34d399">"SOUVIK_CHOWDHURY"</tspan><tspan fill="#818cf8">)</tspan>
    </text>
  </g>

  <!-- 2. Giant Holographic Title: SOUVIK CHOWDHURY -->
  <g transform="translate(36, 94)">
    <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="900" fill="url(#neonTitle)"
          letter-spacing="2" filter="url(#neonFilter)">
      SOUVIK CHOWDHURY
    </text>
  </g>

  <!-- 3. Subtitle Role Banner -->
  <g transform="translate(36, 126)">
    <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
      AI &amp; COMPUTER VISION ARCHITECT  ·  WEB3 BUILDER
    </text>
  </g>

  <!-- 4. Interactive Holographic Badges -->
  <g transform="translate(36, 146)">
    <!-- Badge 1: SignGesture AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="25" rx="6" fill="#00f5ff" fill-opacity="0.1" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="12" cy="12.5" r="3" fill="#10b981"/>
      <text x="22" y="16.5" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#67e8f9">SignGesture AI · 99.7%</text>
    </g>

    <!-- Badge 2: Decentralized KYC -->
    <g transform="translate(176, 0)">
      <rect x="0" y="0" width="144" height="25" rx="6" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="12" cy="12.5" r="3" fill="#818cf8"/>
      <text x="22" y="16.5" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#c7d2fe">Decentralized KYC</text>
    </g>

    <!-- Badge 3: 160-Day DSA -->
    <g transform="translate(328, 0)">
      <rect x="0" y="0" width="130" height="25" rx="6" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="12" cy="12.5" r="3" fill="#ec4899"/>
      <text x="22" y="16.5" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#fbcfe8">160-Day DSA (C++)</text>
    </g>
  </g>

  <!-- 5. University & Location Telemetry (Bottom Right) -->
  <g transform="translate(864, 255)" text-anchor="end">
    <text font-family="'Courier New', Courier, monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">
      B.TECH CSE (AIML) · UEM JAIPUR · JAIPUR, INDIA
    </text>
  </g>

  <!-- Glowing Laser Beam Divider at Bottom -->
  <rect x="0" y="277" width="900" height="3" fill="url(#laserGrad)"/>
</svg>
