<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="270">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#141a2e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#080c14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="polyGlow" cx="730" cy="115" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#7928ca"/>
      <stop offset="75%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Grid Horizon Mask -->
    <linearGradient id="horizonFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Laser Divider -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ffcc" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rotatePoly {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes counterRotate {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { opacity: 0.7; r: 7; }
      50% { opacity: 1; r: 10; }
    }
    @keyframes gridFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(12px); }
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
    }
    .poly-group {
      transform-origin: 730px 115px;
      animation: rotatePoly 22s linear infinite;
    }
    .poly-inner {
      transform-origin: 730px 115px;
      animation: counterRotate 15s linear infinite;
    }
    .core-node {
      animation: pulseCore 3s ease-in-out infinite;
    }
    .laser-beam {
      animation: beamPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="900" height="270" fill="url(#bgGlow)"/>

  <!-- Background Stars / Floating Particles -->
  <g opacity="0.6">
    <circle cx="80" cy="45" r="1.2" fill="#00f2fe" opacity="0.8"/>
    <circle cx="160" cy="90" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="280" cy="30" r="1" fill="#ff007f" opacity="0.7"/>
    <circle cx="390" cy="65" r="1.3" fill="#00f2fe" opacity="0.5"/>
    <circle cx="510" cy="40" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="610" cy="75" r="1" fill="#7928ca" opacity="0.6"/>
    <circle cx="850" cy="45" r="1.4" fill="#00f2fe" opacity="0.8"/>
    <circle cx="880" cy="110" r="1" fill="#ff007f" opacity="0.5"/>
  </g>

  <!-- Cyber Synthwave Perspective Grid Floor (Bottom Horizon at Y=175) -->
  <g mask="url(#horizonFadeMask)">
    <mask id="horizonFadeMask">
      <rect x="0" y="165" width="900" height="105" fill="url(#horizonFade)"/>
    </mask>

    <!-- Grid Horizontal Lines -->
    <g stroke="#00f2fe" stroke-width="0.85" opacity="0.38">
      <line x1="0" y1="180" x2="900" y2="180"/>
      <line x1="0" y1="190" x2="900" y2="190"/>
      <line x1="0" y1="203" x2="900" y2="203"/>
      <line x1="0" y1="219" x2="900" y2="219"/>
      <line x1="0" y1="238" x2="900" y2="238"/>
      <line x1="0" y1="260" x2="900" y2="260"/>
    </g>

    <!-- Grid Perspective Radians (Vanishing Point: cx=450, cy=175) -->
    <g stroke="#7928ca" stroke-width="0.9" opacity="0.45">
      <line x1="450" y1="175" x2="-100" y2="270"/>
      <line x1="450" y1="175" x2="50" y2="270"/>
      <line x1="450" y1="175" x2="160" y2="270"/>
      <line x1="450" y1="175" x2="260" y2="270"/>
      <line x1="450" y1="175" x2="350" y2="270"/>
      <line x1="450" y1="175" x2="450" y2="270" stroke="#00f2fe" opacity="0.7"/>
      <line x1="450" y1="175" x2="550" y2="270"/>
      <line x1="450" y1="175" x2="640" y2="270"/>
      <line x1="450" y1="175" x2="740" y2="270"/>
      <line x1="450" y1="175" x2="850" y2="270"/>
      <line x1="450" y1="175" x2="1000" y2="270"/>
    </g>
  </g>

  <!-- 3D Polytope / Wireframe Celestial Quantum Engine (Right Side) -->
  <circle cx="730" cy="115" r="110" fill="url(#polyGlow)"/>

  <!-- Outer Polyhedron Wireframe Group -->
  <g class="poly-group" filter="url(#intenseGlow)">
    <!-- Outer 3D Icosahedron Lattice Edges -->
    <g stroke="#00f2fe" stroke-width="1.3" opacity="0.75" fill="none">
      <polygon points="730,40 798,75 798,155 730,190 662,155 662,75"/>
      <line x1="730" y1="40" x2="730" y2="190"/>
      <line x1="662" y1="75" x2="798" y2="155"/>
      <line x1="662" y1="155" x2="798" y2="75"/>
      <line x1="730" y1="40" x2="760" y2="115"/>
      <line x1="730" y1="190" x2="700" y2="115"/>
      <line x1="662" y1="75" x2="760" y2="115"/>
      <line x1="798" y1="155" x2="700" y2="115"/>
    </g>

    <!-- Outer Nodes -->
    <g fill="#00ffff">
      <circle cx="730" cy="40" r="3.2"/>
      <circle cx="798" cy="75" r="3.2"/>
      <circle cx="798" cy="155" r="3.2"/>
      <circle cx="730" cy="190" r="3.2"/>
      <circle cx="662" cy="155" r="3.2"/>
      <circle cx="662" cy="75" r="3.2"/>
    </g>
  </g>

  <!-- Inner Counter-Rotating Octahedron / Tesseract Core -->
  <g class="poly-inner" filter="url(#intenseGlow)">
    <g stroke="#ff007f" stroke-width="1.2" opacity="0.85" fill="none">
      <polygon points="730,68 772,115 730,162 688,115"/>
      <line x1="730" y1="68" x2="730" y2="162" stroke="#ffffff" stroke-width="0.8"/>
      <line x1="688" y1="115" x2="772" y2="115" stroke="#ffffff" stroke-width="0.8"/>
    </g>
    <g fill="#ff00a0">
      <circle cx="730" cy="68" r="2.8"/>
      <circle cx="772" cy="115" r="2.8"/>
      <circle cx="730" cy="162" r="2.8"/>
      <circle cx="688" cy="115" r="2.8"/>
    </g>
    <!-- Central Pulsing Plasma Core Node -->
    <circle class="core-node" cx="730" cy="115" r="7" fill="#ffffff" filter="url(#intenseGlow)"/>
  </g>

  <!-- Left Content: Code Terminal Prompt, Big Hero Title, Badges -->
  <g transform="translate(36, 0)">
    <!-- Terminal Code Prompt -->
    <g transform="translate(0, 48)">
      <text font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#00f2fe" letter-spacing="1.2">
        <tspan fill="#ff007f">&gt;</tspan> sys.init<tspan fill="#7928ca">(</tspan><tspan fill="#38ef7d">"SOUVIK_CHOWDHURY"</tspan><tspan fill="#7928ca">)</tspan>
      </text>
    </g>

    <!-- Main Title: SOUVIK CHOWDHURY -->
    <g transform="translate(0, 98)">
      <text font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#neonTitle)" letter-spacing="2.5" filter="url(#intenseGlow)">
        SOUVIK CHOWDHURY
      </text>
    </g>

    <!-- Subtitle: Roles -->
    <g transform="translate(2, 126)">
      <text font-family="'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.8">
        AI &amp; Computer Vision Engineer <tspan fill="#00f2fe">·</tspan> Machine Learning <tspan fill="#ff007f">·</tspan> Full-Stack Developer
      </text>
    </g>

    <!-- Live Project Pills / Badges -->
    <g transform="translate(2, 155)">
      <!-- Pill 1: SignGesture AI -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="25" rx="12.5" fill="#0e1726" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
        <circle cx="12" cy="12.5" r="3.5" fill="#00f2fe"/>
        <text x="22" y="16.5" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="0.3">
          SignGesture AI (99.7%)
        </text>
      </g>

      <!-- Pill 2: Real-Time CV & Assistive -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="162" height="25" rx="12.5" fill="#140f24" stroke="#ff007f" stroke-width="1" opacity="0.9"/>
        <circle cx="12" cy="12.5" r="3.5" fill="#ff007f"/>
        <text x="22" y="16.5" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="0.3">
          Real-Time CV &amp; Models
        </text>
      </g>

      <!-- Pill 3: Web3 & Blockchain -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="158" height="25" rx="12.5" fill="#120e28" stroke="#7928ca" stroke-width="1" opacity="0.9"/>
        <circle cx="12" cy="12.5" r="3.5" fill="#7928ca"/>
        <text x="22" y="16.5" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="0.3">
          Web3 &amp; Smart Contracts
        </text>
      </g>
    </g>

    <!-- University & Branch Tag -->
    <g transform="translate(2, 210)">
      <text font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400" fill="#64748b" letter-spacing="0.6">
        <tspan fill="#38ef7d">B.Tech CSE (AIML)</tspan> · UEM Jaipur · Jaipur, India
      </text>
    </g>
  </g>

  <!-- Glowing Laser Separator Beam at the Bottom -->
  <g class="laser-beam" transform="translate(0, 266)">
    <line x1="40" y1="0" x2="860" y2="0" stroke="url(#laserGrad)" stroke-width="2.5" filter="url(#intenseGlow)"/>
    <ellipse cx="450" cy="0" rx="35" ry="2" fill="#00ffcc" filter="url(#intenseGlow)"/>
  </g>
</svg>
