<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="440">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cosmosBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#080c16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="1"/>
    </radialGradient>

    <!-- Core Plasma Glow -->
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 3D Celestial Sphere Rotation Animations */
    @keyframes spinSphere {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes orbitTilt1 {
      0% { transform: rotate(-25deg) scaleY(0.4) rotate(0deg); }
      100% { transform: rotate(-25deg) scaleY(0.4) rotate(360deg); }
    }
    @keyframes orbitTilt2 {
      0% { transform: rotate(35deg) scaleY(0.35) rotate(360deg); }
      100% { transform: rotate(35deg) scaleY(0.35) rotate(0deg); }
    }

    /* 3D Orbit Keyframes for Floating Tech Labels */
    /* Orbit 1: Equatorial fast orbit */
    @keyframes orbitEq1 {
      0%   { transform: translate(440px, 220px) translate(190px, 0px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      25%  { transform: translate(440px, 220px) translate(0px, 48px) scale(0.92); opacity: 0.75; }
      50%  { transform: translate(440px, 220px) translate(-190px, 0px) scale(0.68); opacity: 0.35; }
      75%  { transform: translate(440px, 220px) translate(0px, -48px) scale(0.92); opacity: 0.75; }
      100% { transform: translate(440px, 220px) translate(190px, 0px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    /* Orbit 2: Offset by 90deg */
    @keyframes orbitEq2 {
      0%   { transform: translate(440px, 220px) translate(0px, 52px) scale(0.92); opacity: 0.75; }
      25%  { transform: translate(440px, 220px) translate(-210px, 0px) scale(0.68); opacity: 0.35; }
      50%  { transform: translate(440px, 220px) translate(0px, -52px) scale(0.92); opacity: 0.75; }
      75%  { transform: translate(440px, 220px) translate(210px, 0px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #38ef7d); }
      100% { transform: translate(440px, 220px) translate(0px, 52px) scale(0.92); opacity: 0.75; }
    }
    /* Orbit 3: Offset by 180deg */
    @keyframes orbitEq3 {
      0%   { transform: translate(440px, 220px) translate(-220px, 0px) scale(0.68); opacity: 0.35; }
      25%  { transform: translate(440px, 220px) translate(0px, -55px) scale(0.92); opacity: 0.75; }
      50%  { transform: translate(440px, 220px) translate(220px, 0px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #ff007f); }
      75%  { transform: translate(440px, 220px) translate(0px, 55px) scale(0.92); opacity: 0.75; }
      100% { transform: translate(440px, 220px) translate(-220px, 0px) scale(0.68); opacity: 0.35; }
    }
    /* Orbit 4: Offset by 270deg */
    @keyframes orbitEq4 {
      0%   { transform: translate(440px, 220px) translate(0px, -58px) scale(0.92); opacity: 0.75; }
      25%  { transform: translate(440px, 220px) translate(230px, 0px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #f1fa8c); }
      50%  { transform: translate(440px, 220px) translate(0px, 58px) scale(0.92); opacity: 0.75; }
      75%  { transform: translate(440px, 220px) translate(-230px, 0px) scale(0.68); opacity: 0.35; }
      100% { transform: translate(440px, 220px) translate(0px, -58px) scale(0.92); opacity: 0.75; }
    }

    /* Orbit Outer Tilted Ellipse A */
    @keyframes orbitTiltA1 {
      0%   { transform: translate(440px, 220px) translate(270px, -50px) scale(1.18); opacity: 1; filter: drop-shadow(0 0 9px #00ffcc); }
      25%  { transform: translate(440px, 220px) translate(80px, 75px) scale(0.95); opacity: 0.8; }
      50%  { transform: translate(440px, 220px) translate(-270px, 50px) scale(0.65); opacity: 0.3; }
      75%  { transform: translate(440px, 220px) translate(-80px, -75px) scale(0.95); opacity: 0.8; }
      100% { transform: translate(440px, 220px) translate(270px, -50px) scale(1.18); opacity: 1; filter: drop-shadow(0 0 9px #00ffcc); }
    }
    @keyframes orbitTiltA2 {
      0%   { transform: translate(440px, 220px) translate(-280px, 55px) scale(0.65); opacity: 0.3; }
      25%  { transform: translate(440px, 220px) translate(-90px, -80px) scale(0.95); opacity: 0.8; }
      50%  { transform: translate(440px, 220px) translate(280px, -55px) scale(1.18); opacity: 1; filter: drop-shadow(0 0 9px #bd93f9); }
      75%  { transform: translate(440px, 220px) translate(90px, 80px) scale(0.95); opacity: 0.8; }
      100% { transform: translate(440px, 220px) translate(-280px, 55px) scale(0.65); opacity: 0.3; }
    }
    @keyframes orbitTiltB1 {
      0%   { transform: translate(440px, 220px) translate(-260px, -65px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 9px #ff79c6); }
      50%  { transform: translate(440px, 220px) translate(260px, 65px) scale(0.65); opacity: 0.35; }
      100% { transform: translate(440px, 220px) translate(-260px, -65px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 9px #ff79c6); }
    }
    @keyframes orbitTiltB2 {
      0%   { transform: translate(440px, 220px) translate(250px, 65px) scale(0.65); opacity: 0.35; }
      50%  { transform: translate(440px, 220px) translate(-250px, -65px) scale(1.15); opacity: 1; filter: drop-shadow(0 0 9px #50fa7b); }
      100% { transform: translate(440px, 220px) translate(250px, 65px) scale(0.65); opacity: 0.35; }
    }

    .sphere-core {
      transform-origin: 440px 220px;
      animation: spinSphere 36s linear infinite;
    }
    .sphere-ring1 {
      transform-origin: 440px 220px;
      animation: orbitTilt1 18s linear infinite;
    }
    .sphere-ring2 {
      transform-origin: 440px 220px;
      animation: orbitTilt2 24s linear infinite;
    }

    .tag-python     { animation: orbitEq1 16s ease-in-out infinite; }
    .tag-opencv     { animation: orbitEq2 16s ease-in-out infinite; }
    .tag-mediapipe  { animation: orbitEq3 16s ease-in-out infinite; }
    .tag-pytorch    { animation: orbitEq4 16s ease-in-out infinite; }
    .tag-tensorflow { animation: orbitTiltA1 22s ease-in-out infinite; }
    .tag-cpp        { animation: orbitTiltA2 22s ease-in-out infinite; }
    .tag-react      { animation: orbitTiltB1 20s ease-in-out infinite; }
    .tag-nextjs     { animation: orbitTiltB2 20s ease-in-out infinite; }
  </style>

  <!-- Container Box with Rounded Cyber Border -->
  <rect x="2" y="2" width="876" height="436" rx="14" fill="url(#cosmosBg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="4" y="4" width="872" height="432" rx="12" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.3"/>

  <!-- Header Banner Section Inside SVG -->
  <g transform="translate(32, 38)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
      // TECH_UNIVERSE
    </text>
    <text x="816" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.8">
      rotating · rendered in 3D
    </text>
    <line x1="0" y1="12" x2="816" y2="12" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Central Glowing Plasma Field -->
  <circle cx="440" cy="220" r="160" fill="url(#plasmaGlow)"/>

  <!-- 3D Particle Sphere: Concentric Latitudes & Longitudes -->
  <g class="sphere-core">
    <!-- Center Core Dot Matrix Sphere -->
    <g stroke="#00f2fe" stroke-width="0.8" fill="none" opacity="0.45">
      <!-- Latitude Ellipses -->
      <ellipse cx="440" cy="220" rx="110" ry="25"/>
      <ellipse cx="440" cy="220" rx="95" ry="55"/>
      <ellipse cx="440" cy="220" rx="65" ry="90"/>
      <!-- Longitude Ellipses -->
      <ellipse cx="440" cy="220" rx="30" ry="110"/>
      <ellipse cx="440" cy="220" rx="80" ry="110"/>
      <!-- Outer Rim -->
      <circle cx="440" cy="220" r="112" stroke-dasharray="3, 5" opacity="0.6"/>
    </g>

    <!-- Glowing Latitude Dots -->
    <g fill="#00ffcc" opacity="0.85">
      <circle cx="440" cy="110" r="2.5"/>
      <circle cx="440" cy="330" r="2.5"/>
      <circle cx="330" cy="220" r="2.5"/>
      <circle cx="550" cy="220" r="2.5"/>
      <circle cx="360" cy="145" r="2"/>
      <circle cx="520" cy="145" r="2"/>
      <circle cx="360" cy="295" r="2"/>
      <circle cx="520" cy="295" r="2"/>
      <circle cx="440" cy="165" r="2"/>
      <circle cx="440" cy="275" r="2"/>
    </g>
  </g>

  <!-- Tilted Orbital Rings with Particles -->
  <g class="sphere-ring1">
    <ellipse cx="440" cy="220" rx="170" ry="170" fill="none" stroke="#7928ca" stroke-width="1" opacity="0.4" stroke-dasharray="6, 8"/>
    <circle cx="610" cy="220" r="3" fill="#ff007f"/>
    <circle cx="270" cy="220" r="3" fill="#00f2fe"/>
  </g>

  <g class="sphere-ring2">
    <ellipse cx="440" cy="220" rx="195" ry="195" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.35" stroke-dasharray="4, 10"/>
    <circle cx="440" cy="25" r="3.5" fill="#38ef7d"/>
    <circle cx="440" cy="415" r="3" fill="#ffbd2e"/>
  </g>

  <!-- Central Glowing Anchor: JAVA & PYTHON HUB -->
  <g transform="translate(440, 220)" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif">
    <!-- Center Core Badge -->
    <circle cx="0" cy="-6" r="36" fill="#0c1424" stroke="#00ffcc" stroke-width="1.8" filter="url(#glowCyan)"/>
    <text y="-2" font-size="14" font-weight="900" fill="#00ffcc" letter-spacing="1">
      Python
    </text>
    <text y="14" font-size="9" font-weight="700" fill="#38ef7d" letter-spacing="0.5">
      CORE AI
    </text>
  </g>

  <!-- Floating Orbiting Tech Labels (True 3D Orbit Keyframe Simulation) -->
  <g text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="12">
    <!-- Tag 1: OpenCV -->
    <g class="tag-opencv">
      <rect x="-42" y="-13" width="84" height="24" rx="12" fill="#08101e" stroke="#00f2fe" stroke-width="1.2"/>
      <text y="4" fill="#00f2fe">OpenCV</text>
    </g>

    <!-- Tag 2: PyTorch -->
    <g class="tag-pytorch">
      <rect x="-44" y="-13" width="88" height="24" rx="12" fill="#180a1c" stroke="#ff007f" stroke-width="1.2"/>
      <text y="4" fill="#ff007f">PyTorch</text>
    </g>

    <!-- Tag 3: MediaPipe -->
    <g class="tag-mediapipe">
      <rect x="-50" y="-13" width="100" height="24" rx="12" fill="#081814" stroke="#38ef7d" stroke-width="1.2"/>
      <text y="4" fill="#38ef7d">MediaPipe</text>
    </g>

    <!-- Tag 4: C++ -->
    <g class="tag-cpp">
      <rect x="-30" y="-13" width="60" height="24" rx="12" fill="#0f1026" stroke="#bd93f9" stroke-width="1.2"/>
      <text y="4" fill="#bd93f9">C++</text>
    </g>

    <!-- Tag 5: TensorFlow -->
    <g class="tag-tensorflow">
      <rect x="-54" y="-13" width="108" height="24" rx="12" fill="#181008" stroke="#ffb86c" stroke-width="1.2"/>
      <text y="4" fill="#ffb86c">TensorFlow</text>
    </g>

    <!-- Tag 6: React -->
    <g class="tag-react">
      <rect x="-36" y="-13" width="72" height="24" rx="12" fill="#081622" stroke="#61dafb" stroke-width="1.2"/>
      <text y="4" fill="#61dafb">React</text>
    </g>

    <!-- Tag 7: Next.js -->
    <g class="tag-nextjs">
      <rect x="-40" y="-13" width="80" height="24" rx="12" fill="#101018" stroke="#ffffff" stroke-width="1.2"/>
      <text y="4" fill="#ffffff">Next.js</text>
    </g>
  </g>

  <!-- Ambient Static Star Dust Nodes in 3D Galaxy Space -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" opacity="0.65">
    <!-- Left Galaxy Quadrant -->
    <text x="80" y="140" fill="#00f2fe">● LangChain</text>
    <text x="130" y="270" fill="#ff79c6">● FastAPI</text>
    <text x="70" y="340" fill="#bd93f9">● Solidity</text>
    <text x="190" y="380" fill="#50fa7b">● Scikit-Learn</text>
    <text x="110" y="200" fill="#8be9fd">● Docker</text>

    <!-- Right Galaxy Quadrant -->
    <text x="720" y="140" fill="#ffb86c">● JavaScript</text>
    <text x="760" y="230" fill="#50fa7b">● Node.js</text>
    <text x="690" y="310" fill="#8be9fd">● PostgreSQL</text>
    <text x="740" y="370" fill="#ff79c6">● TailwindCSS</text>
    <text x="650" y="180" fill="#bd93f9">● Git &amp; CI/CD</text>
  </g>
</svg>
