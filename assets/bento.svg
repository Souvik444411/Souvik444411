<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#030712"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>

    <!-- Individual card glass backgrounds -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes countUp1 {
      0%   { opacity:0; transform: translateY(6px); }
      100% { opacity:1; transform: translateY(0); }
    }
    @keyframes barGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes orbPulse {
      0%,100% { opacity:0.6; }
      50% { opacity:1; }
    }

    .card-anim { animation: countUp1 0.8s ease both; }
    .c1 { animation-delay: 0.1s; }
    .c2 { animation-delay: 0.3s; }
    .c3 { animation-delay: 0.5s; }
    .c4 { animation-delay: 0.7s; }

    .bar {
      transform-origin: left center;
      animation: barGrow 1.4s cubic-bezier(0.16,1,0.3,1) 0.6s both;
    }
    .orb { animation: orbPulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="900" height="180" fill="url(#bg)"/>

  <!-- ═══ BENTO CARD 1 — SignGesture AI ═══ -->
  <g class="card-anim c1" transform="translate(16, 20)">
    <rect width="202" height="142" rx="12" fill="url(#g1)" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- Icon area -->
    <rect x="12" y="14" width="34" height="34" rx="8" fill="#6366f1" fill-opacity="0.2"/>
    <text x="29" y="36" text-anchor="middle" font-size="18">🤟</text>
    <!-- Label -->
    <text x="54" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#818cf8" letter-spacing="0.8">FLAGSHIP · AI</text>
    <!-- Title -->
    <text x="12" y="68" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">SignGesture AI</text>
    <!-- Description -->
    <text x="12" y="88" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">Real-time ASL recognition</text>
    <text x="12" y="102" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">with 21-landmark CV pipeline</text>
    <!-- Accuracy pill -->
    <rect x="12" y="114" width="88" height="18" rx="9" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="0.6" stroke-opacity="0.5"/>
    <circle class="orb" cx="24" cy="123" r="3" fill="#22c55e"/>
    <text x="32" y="127" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#86efac">99.73% ACC.</text>
  </g>

  <!-- ═══ BENTO CARD 2 — KYC Blockchain ═══ -->
  <g class="card-anim c2" transform="translate(230, 20)">
    <rect width="202" height="142" rx="12" fill="url(#g3)" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="12" y="14" width="34" height="34" rx="8" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="29" y="36" text-anchor="middle" font-size="18">🔐</text>
    <text x="54" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fb7185" letter-spacing="0.8">WEB3 · BLOCKCHAIN</text>
    <text x="12" y="68" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">KYC on Chain</text>
    <text x="12" y="88" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">Decentralized identity layer</text>
    <text x="12" y="102" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">built on Ethereum / Solidity</text>
    <rect x="12" y="114" width="96" height="18" rx="9" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="20" y="127" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fda4af">Smart Contracts</text>
  </g>

  <!-- ═══ BENTO CARD 3 — Algo Challenge ═══ -->
  <g class="card-anim c3" transform="translate(444, 20)">
    <rect width="202" height="142" rx="12" fill="url(#g4)" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="12" y="14" width="34" height="34" rx="8" fill="#22c55e" fill-opacity="0.2"/>
    <text x="29" y="36" text-anchor="middle" font-size="18">⚡</text>
    <text x="54" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4ade80" letter-spacing="0.8">DSA · ALGORITHMS</text>
    <text x="12" y="68" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">GFG 160 Days</text>
    <text x="12" y="88" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">160-day intensive journey</text>
    <text x="12" y="102" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">solving complex DSA in C++</text>
    <!-- Progress bar -->
    <rect x="12" y="118" width="178" height="8" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <rect class="bar" x="12" y="118" width="142" height="8" rx="4" fill="#22c55e" fill-opacity="0.7"/>
    <text x="162" y="127" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4ade80">80%</text>
  </g>

  <!-- ═══ BENTO CARD 4 — Amazon Frontend ═══ -->
  <g class="card-anim c4" transform="translate(658, 20)">
    <rect width="226" height="142" rx="12" fill="url(#g2)" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="12" y="14" width="34" height="34" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="29" y="36" text-anchor="middle" font-size="18">🛒</text>
    <text x="54" y="26" font-family="'JetBrains Mono',monospace" font-size="9" fill="#22d3ee" letter-spacing="0.8">UI/UX · FRONTEND</text>
    <text x="12" y="68" font-family="'Inter','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">E-Commerce UI</text>
    <text x="12" y="88" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">Amazon-style responsive</text>
    <text x="12" y="102" font-family="'Inter',sans-serif" font-size="10.5" fill="#64748b">frontend with dynamic cart</text>
    <rect x="12" y="114" width="68" height="18" rx="9" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="20" y="127" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#67e8f9">JavaScript</text>
  </g>
</svg>
