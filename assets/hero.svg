<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Deep Space Base -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#030712"/>
      <stop offset="45%"  stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Aurora top-left bloom -->
    <radialGradient id="aurora1" cx="18%" cy="30%" r="38%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal bloom bottom-right -->
    <radialGradient id="aurora2" cx="82%" cy="72%" r="40%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Rose accent bloom -->
    <radialGradient id="aurora3" cx="55%" cy="15%" r="30%">
      <stop offset="0%"   stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card surface -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e2e8f0"/>
      <stop offset="50%"  stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Thin border glow -->
    <filter id="borderGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for rounded banner -->
    <clipPath id="bannerClip">
      <rect width="900" height="320" rx="0"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

    /* ── Typing animation for the code line ── */
    @keyframes typing {
      0%   { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0% 0 0); }
    }
    @keyframes blink {
      0%,49% { opacity:1; } 50%,100% { opacity:0; }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes pulseGreen {
      0%,100% { r:4; opacity:1; }
      50%     { r:6; opacity:0.6; }
    }
    @keyframes floatStar {
      0%,100% { transform:translateY(0); opacity:0.6; }
      50%     { transform:translateY(-4px); opacity:1; }
    }
    @keyframes rotateLine {
      from { stroke-dashoffset: 320; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0%   { opacity:0.5; }
      50%  { opacity:1; }
      100% { opacity:0.5; }
    }

    .line1 {
      animation: typing 2s steps(32) 0.5s both;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .line2 {
      animation: typing 2.2s steps(38) 2.8s both;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .line3 {
      animation: typing 1.8s steps(28) 5.2s both;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .cursor { animation: blink 1s infinite; }
    .hero-name { animation: fadeUp 1s 0.3s both; }
    .hero-sub  { animation: fadeUp 1s 0.7s both; }
    .hero-tags { animation: fadeUp 1s 1.1s both; }
    .status-dot { animation: pulseGreen 2s ease-in-out infinite; }
    .star1 { animation: floatStar 3.1s ease-in-out infinite; }
    .star2 { animation: floatStar 4.2s ease-in-out 0.8s infinite; }
    .star3 { animation: floatStar 2.8s ease-in-out 1.6s infinite; }
    .arc-draw {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      animation: rotateLine 2s ease-out 0.2s forwards;
    }
    .metric-shimmer { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- ── Space background ── -->
    <rect width="900" height="320" fill="url(#spaceBg)"/>
    <rect width="900" height="320" fill="url(#aurora1)"/>
    <rect width="900" height="320" fill="url(#aurora2)"/>
    <rect width="900" height="320" fill="url(#aurora3)"/>

    <!-- Subtle star field -->
    <g class="star1"><circle cx="72"  cy="48"  r="1"   fill="#e2e8f0" opacity="0.5"/></g>
    <g class="star2"><circle cx="210" cy="92"  r="1.3" fill="#c7d2fe" opacity="0.6"/></g>
    <g class="star3"><circle cx="430" cy="38"  r="1"   fill="#67e8f9" opacity="0.5"/></g>
    <g class="star1"><circle cx="640" cy="70"  r="1.2" fill="#e2e8f0" opacity="0.4"/></g>
    <g class="star2"><circle cx="800" cy="30"  r="1"   fill="#c7d2fe" opacity="0.5"/></g>
    <g class="star3"><circle cx="860" cy="130" r="1.3" fill="#67e8f9" opacity="0.6"/></g>
    <g class="star1"><circle cx="150" cy="260" r="1"   fill="#e2e8f0" opacity="0.4"/></g>
    <g class="star2"><circle cx="760" cy="285" r="1.2" fill="#c7d2fe" opacity="0.5"/></g>

    <!-- ═══════════════════════════════════════════════════
         LEFT PANEL — Identity Block  (x:0 → 530)
    ══════════════════════════════════════════════════════ -->

    <!-- Thin vertical accent line far left -->
    <rect x="38" y="60" width="2" height="200" rx="1" fill="#6366f1" opacity="0.5"/>

    <!-- Status badge row -->
    <g class="hero-tags" transform="translate(52, 60)">
      <rect width="118" height="22" rx="11" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle class="status-dot" cx="14" cy="11" r="4" fill="#22c55e"/>
      <text x="26" y="15" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" fill="#86efac" letter-spacing="0.5">OPEN TO WORK</text>

      <rect x="128" width="108" height="22" rx="11" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="142" y="15" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" fill="#67e8f9" letter-spacing="0.5">CSE · AIML · UEM</text>
    </g>

    <!-- Name block -->
    <g class="hero-name" transform="translate(52, 108)">
      <text font-family="'Inter','Segoe UI',sans-serif" font-size="48" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5">Souvik</text>
      <text x="0" y="52" font-family="'Inter','Segoe UI',sans-serif" font-size="48" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5" opacity="0.7">Chowdhury</text>
    </g>

    <!-- Role subtitle with typed caret -->
    <g class="hero-sub" transform="translate(53, 220)">
      <text font-family="'Inter',sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
        AI &amp; CV Engineer  ·  Web3 Builder  ·  Open-Source
      </text>
    </g>

    <!-- Skill chips row -->
    <g class="hero-tags" transform="translate(52, 248)">
      <!-- Chip 1 -->
      <rect width="80" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
      <text x="10" y="14" font-family="'JetBrains Mono',monospace" font-size="10" fill="#c7d2fe">PyTorch</text>
      <!-- Chip 2 -->
      <rect x="90" width="84" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
      <text x="102" y="14" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67e8f9">MediaPipe</text>
      <!-- Chip 3 -->
      <rect x="184" width="72" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
      <text x="196" y="14" font-family="'JetBrains Mono',monospace" font-size="10" fill="#c7d2fe">Solidity</text>
      <!-- Chip 4 -->
      <rect x="266" width="66" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.12"/>
      <text x="278" y="14" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67e8f9">Next.js</text>
    </g>

    <!-- ═══════════════════════════════════════════════════
         RIGHT PANEL — Code block  (x:560 → 900)
         Glass card bg
    ══════════════════════════════════════════════════════ -->
    <rect x="568" y="38" width="302" height="246" rx="14" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.08"/>

    <!-- Window chrome dots -->
    <circle cx="590" cy="62" r="5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="606" cy="62" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="622" cy="62" r="5" fill="#22c55e" opacity="0.8"/>
    <text x="648" y="66" font-family="'JetBrains Mono',monospace" font-size="10" fill="#475569">souvik.py — workspace</text>

    <!-- Separator below chrome -->
    <line x1="568" y1="78" x2="870" y2="78" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>

    <!-- Line numbers column -->
    <g font-family="'JetBrains Mono',monospace" font-size="11" fill="#374151" text-anchor="end">
      <text x="596" y="106">1</text>
      <text x="596" y="124">2</text>
      <text x="596" y="142">3</text>
      <text x="596" y="160">4</text>
      <text x="596" y="178">5</text>
      <text x="596" y="196">6</text>
      <text x="596" y="214">7</text>
      <text x="596" y="232">8</text>
      <text x="596" y="250">9</text>
    </g>

    <!-- Code lines with typing animation -->
    <g transform="translate(606, 90)" font-size="11.5" fill="#e2e8f0">

      <!-- line 1 -->
      <g class="line1">
        <text y="16" fill="#818cf8" font-family="'JetBrains Mono',monospace">class </text>
        <text x="37" y="16" fill="#67e8f9" font-family="'JetBrains Mono',monospace">Developer</text>
        <text x="102" y="16" fill="#e2e8f0" font-family="'JetBrains Mono',monospace">:</text>
      </g>

      <!-- line 2 -->
      <g class="line2">
        <text y="34" fill="#94a3b8" font-family="'JetBrains Mono',monospace">  </text>
        <text x="8" y="34" fill="#818cf8" font-family="'JetBrains Mono',monospace">name </text>
        <text x="43" y="34" fill="#f43f5e" font-family="'JetBrains Mono',monospace">=</text>
        <text x="52" y="34" fill="#86efac" font-family="'JetBrains Mono',monospace"> "Souvik Chowdhury"</text>
      </g>

      <!-- line 3 blank -->
      <text y="52" fill="#374151" font-family="'JetBrains Mono',monospace">  </text>

      <!-- line 4 -->
      <g class="line1">
        <text y="70" fill="#94a3b8" font-family="'JetBrains Mono',monospace">  </text>
        <text x="8" y="70" fill="#818cf8" font-family="'JetBrains Mono',monospace">skills</text>
        <text x="47" y="70" fill="#f43f5e" font-family="'JetBrains Mono',monospace"> =</text>
        <text x="62" y="70" fill="#e2e8f0" font-family="'JetBrains Mono',monospace"> [</text>
      </g>

      <!-- line 5 -->
      <g class="line2">
        <text y="88" fill="#86efac" font-family="'JetBrains Mono',monospace">    "CV/AI"</text>
        <text x="60" y="88" fill="#94a3b8" font-family="'JetBrains Mono',monospace">, </text>
        <text x="72" y="88" fill="#86efac" font-family="'JetBrains Mono',monospace">"Web3"</text>
        <text x="116" y="88" fill="#94a3b8" font-family="'JetBrains Mono',monospace">, </text>
        <text x="128" y="88" fill="#86efac" font-family="'JetBrains Mono',monospace">"Full-Stack"</text>
      </g>

      <!-- line 6 -->
      <g class="line3">
        <text y="106" fill="#e2e8f0" font-family="'JetBrains Mono',monospace">  ]</text>
      </g>

      <!-- line 7 blank -->
      <text y="124" fill="#374151" font-family="'JetBrains Mono',monospace">  </text>

      <!-- line 8 -->
      <g class="line2">
        <text y="142" fill="#818cf8" font-family="'JetBrains Mono',monospace">  def </text>
        <text x="37" y="142" fill="#fde68a" font-family="'JetBrains Mono',monospace">current_mission</text>
        <text x="145" y="142" fill="#e2e8f0" font-family="'JetBrains Mono',monospace">(self):</text>
      </g>

      <!-- line 9 -->
      <g class="line3">
        <text y="160" fill="#94a3b8" font-family="'JetBrains Mono',monospace">    </text>
        <text x="20" y="160" fill="#818cf8" font-family="'JetBrains Mono',monospace">return </text>
        <text x="67" y="160" fill="#86efac" font-family="'JetBrains Mono',monospace">"Build. Ship. Repeat."</text>
      </g>

      <!-- blinking cursor -->
      <rect class="cursor" x="0" y="170" width="8" height="13" rx="1" fill="#6366f1" opacity="0.9"/>
    </g>

    <!-- Bottom divider bar inside glass card -->
    <rect x="568" y="262" width="302" height="22" rx="0" fill="#ffffff" fill-opacity="0.025"/>
    <text x="583" y="277" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#4b5563">python</text>
    <text x="840" y="277" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#4b5563">UTF-8  LF</text>

    <!-- ── Metric dots row (bottom of left panel) ── -->
    <g transform="translate(52, 285)" font-family="'JetBrains Mono',monospace" font-size="10.5">
      <!-- ML Accuracy -->
      <circle cx="6" cy="6" r="3.5" fill="#22c55e" class="metric-shimmer"/>
      <text x="16" y="10" fill="#64748b">99.73% ML Acc.</text>
      <!-- Separator -->
      <text x="112" y="10" fill="#334155">·</text>
      <!-- Repos -->
      <circle cx="124" cy="6" r="3.5" fill="#6366f1" class="metric-shimmer"/>
      <text x="134" y="10" fill="#64748b">5 Repos</text>
      <!-- Separator -->
      <text x="192" y="10" fill="#334155">·</text>
      <!-- Role -->
      <circle cx="204" cy="6" r="3.5" fill="#06b6d4" class="metric-shimmer"/>
      <text x="214" y="10" fill="#64748b">Jaipur, India</text>
    </g>

    <!-- Bottom fade line -->
    <rect x="0" y="308" width="900" height="12" fill="url(#spaceBg)" opacity="0.8"/>
  </g>
</svg>
