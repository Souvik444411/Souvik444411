<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <defs>
    <!-- Deep space gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="60%" stop-color="#06091a"/>
      <stop offset="100%" stop-color="#020812"/>
    </linearGradient>
    <!-- Aurora glows -->
    <radialGradient id="g1" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <!-- Terminal glass -->
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes blink {
      0%,48%  { opacity: 1; }
      50%,98% { opacity: 0; }
      100%    { opacity: 1; }
    }
    @keyframes pulse {
      0%,100% { opacity: 0.6; r: 3px; }
      50%     { opacity: 1;   r: 5px; }
    }
    @keyframes scanline {
      0%   { transform: translateY(0); opacity: 0.04; }
      100% { transform: translateY(230px); opacity: 0.04; }
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0px); }
      50%     { transform: translateY(-6px); }
    }
    @keyframes shimmer {
      0%   { opacity: 0.3; }
      50%  { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    .badge { animation: fadeUp 0.6s ease both; }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.25s; }
    .b3 { animation-delay: 0.4s; }
    .b4 { animation-delay: 0.55s; }
    .name1 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
    .name2 { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.7s both; }
    .sub   { animation: fadeUp 0.6s ease 1.0s both; }
    .dot   { animation: pulse 2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .cline1  { animation: fadeIn 0.3s ease 1.2s both; }
    .cline2  { animation: fadeIn 0.3s ease 1.6s both; }
    .cline3  { animation: fadeIn 0.3s ease 2.0s both; }
    .cline4  { animation: fadeIn 0.3s ease 2.4s both; }
    .cline5  { animation: fadeIn 0.3s ease 2.8s both; }
    .cline6  { animation: fadeIn 0.3s ease 3.2s both; }
    .cline7  { animation: fadeIn 0.3s ease 3.6s both; }
    .cline8  { animation: fadeIn 0.3s ease 4.0s both; }
    .floatEl { animation: floatY 4s ease-in-out infinite; }
    .scan    { animation: scanline 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="880" height="320" fill="url(#bg)"/>
  <rect width="880" height="320" fill="url(#g1)"/>
  <rect width="880" height="320" fill="url(#g2)"/>
  <rect width="880" height="320" fill="url(#g3)"/>

  <!-- Star field -->
  <g opacity="0.5">
    <circle cx="30" cy="20" r="1" fill="#fff" opacity="0.4"/>
    <circle cx="85" cy="55" r="0.8" fill="#fff" opacity="0.3"/>
    <circle cx="140" cy="30" r="1.2" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="200" cy="80" r="0.7" fill="#fff" opacity="0.3"/>
    <circle cx="260" cy="15" r="1" fill="#67e8f9" opacity="0.4"/>
    <circle cx="320" cy="60" r="0.8" fill="#fff" opacity="0.2"/>
    <circle cx="45" cy="120" r="0.9" fill="#fff" opacity="0.3"/>
    <circle cx="100" cy="160" r="1.1" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="160" cy="200" r="0.7" fill="#fff" opacity="0.2"/>
    <circle cx="220" cy="260" r="1" fill="#67e8f9" opacity="0.3"/>
    <circle cx="380" cy="40" r="0.8" fill="#fff" opacity="0.3"/>
    <circle cx="420" cy="130" r="1.2" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="460" cy="280" r="0.7" fill="#fff" opacity="0.2"/>
    <circle cx="50" cy="290" r="1" fill="#fff" opacity="0.2"/>
    <circle cx="310" cy="290" r="0.8" fill="#a5b4fc" opacity="0.3"/>
  </g>

  <!-- LEFT PANEL: Identity block (x=0 to x=490) -->
  
  <!-- Status dot + label -->
  <g class="badge b1" opacity="0">
    <circle cx="30" cy="34" r="4" fill="#22c55e" class="dot"/>
    <text x="40" y="38" font-family="Courier New,Courier,monospace" font-size="10" fill="#22c55e" letter-spacing="1">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Badge row -->
  <g transform="translate(0,55)">
    <!-- Badge 1: Python -->
    <g class="badge b1" opacity="0">
      <rect x="30" y="0" width="66" height="20" rx="10" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.6"/>
      <text x="63" y="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">🐍 Python</text>
    </g>
    <!-- Badge 2: AI/ML -->
    <g class="badge b2" opacity="0">
      <rect x="102" y="0" width="56" height="20" rx="10" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.5"/>
      <text x="130" y="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">🤖 AI/ML</text>
    </g>
    <!-- Badge 3: Web3 -->
    <g class="badge b3" opacity="0">
      <rect x="164" y="0" width="58" height="20" rx="10" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.5"/>
      <text x="193" y="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#fb7185" text-anchor="middle">🔗 Web3</text>
    </g>
    <!-- Badge 4: UEM Jaipur -->
    <g class="badge b4" opacity="0">
      <rect x="228" y="0" width="82" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.5"/>
      <text x="269" y="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">🎓 UEM Jaipur</text>
    </g>
  </g>

  <!-- Big name: SOUVIK -->
  <text x="30" y="140" 
        font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="58" font-weight="800" letter-spacing="2"
        fill="url(#nameGrad)" filter="url(#softglow)"
        class="name1" opacity="0">SOUVIK</text>

  <!-- Big name: CHOWDHURY -->
  <text x="30" y="195"
        font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="38" font-weight="300" letter-spacing="8"
        fill="#94a3b8"
        class="name2" opacity="0">CHOWDHURY</text>

  <!-- Thin accent line under name -->
  <rect x="30" y="206" width="300" height="1" fill="url(#nameGrad)" opacity="0.4" class="name2"/>

  <!-- Subtitle -->
  <text x="30" y="232"
        font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" fill="#64748b" letter-spacing="0.5"
        class="sub" opacity="0">AI &amp; Computer Vision Engineer  ·  Web3 Builder  ·  B.Tech CSE AIML</text>

  <!-- Mini stats row -->
  <g class="sub" opacity="0">
    <circle cx="34" cy="263" r="3.5" fill="#22c55e" class="dot"/>
    <text x="43" y="267" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">99.73% ML Acc.</text>

    <circle cx="140" cy="263" r="3.5" fill="#6366f1"/>
    <text x="149" y="267" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">5 Repos</text>

    <circle cx="208" cy="263" r="3.5" fill="#06b6d4"/>
    <text x="217" y="267" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Jaipur, India</text>
  </g>

  <!-- RIGHT PANEL: Code terminal (x=510 to x=870) -->
  <!-- Terminal window -->
  <g class="floatEl">
    <rect x="510" y="22" width="356" height="278" rx="10" fill="url(#termGlass)" stroke="#1e293b" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="510" y="22" width="356" height="34" rx="10" fill="#0f172a"/>
    <rect x="510" y="42" width="356" height="14" fill="#0f172a"/>
    <!-- Traffic lights -->
    <circle cx="530" cy="39" r="5.5" fill="#f43f5e"/>
    <circle cx="547" cy="39" r="5.5" fill="#f59e0b"/>
    <circle cx="564" cy="39" r="5.5" fill="#22c55e"/>
    <!-- Title -->
    <text x="688" y="43" text-anchor="middle" font-family="Courier New,Courier,monospace" font-size="10" fill="#475569">souvik.py — workspace</text>
    <!-- Scan line animation -->
    <rect x="510" y="56" width="356" height="8" fill="#6366f1" class="scan" opacity="0.04"/>
    <!-- Code content -->
    <!-- Line numbers + code -->
    <text x="525" y="78" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline1" opacity="0">1</text>
    <text x="545" y="78" font-family="Courier New,Courier,monospace" font-size="11" fill="#6366f1" class="cline1" opacity="0">class</text>
    <text x="582" y="78" font-family="Courier New,Courier,monospace" font-size="11" fill="#e2e8f0" class="cline1" opacity="0">Developer</text>
    <text x="646" y="78" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline1" opacity="0">:</text>

    <text x="525" y="97" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline2" opacity="0">2</text>
    <text x="545" y="97" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline2" opacity="0">  name</text>
    <text x="588" y="97" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline2" opacity="0">=</text>
    <text x="598" y="97" font-family="Courier New,Courier,monospace" font-size="11" fill="#86efac" class="cline2" opacity="0">"Souvik Chowdhury"</text>

    <text x="525" y="116" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline3" opacity="0">3</text>

    <text x="525" y="135" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline4" opacity="0">4</text>
    <text x="545" y="135" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline4" opacity="0">  skills</text>
    <text x="594" y="135" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline4" opacity="0">=</text>
    <text x="604" y="135" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline4" opacity="0">[</text>

    <text x="525" y="154" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline5" opacity="0">5</text>
    <text x="545" y="154" font-family="Courier New,Courier,monospace" font-size="11" fill="#86efac" class="cline5" opacity="0">    "CV/AI"</text>
    <text x="606" y="154" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline5" opacity="0">, "Web3"</text>
    <text x="656" y="154" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline5" opacity="0">, "DSA"</text>

    <text x="525" y="173" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline6" opacity="0">6</text>
    <text x="545" y="173" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline6" opacity="0">  ]</text>

    <text x="525" y="192" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline7" opacity="0">7</text>

    <text x="525" y="211" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline8" opacity="0">8</text>
    <text x="545" y="211" font-family="Courier New,Courier,monospace" font-size="11" fill="#6366f1" class="cline8" opacity="0">  def</text>
    <text x="577" y="211" font-family="Courier New,Courier,monospace" font-size="11" fill="#67e8f9" class="cline8" opacity="0">current_mission</text>
    <text x="692" y="211" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline8" opacity="0">(self):</text>

    <!-- Line 9 with cursor -->
    <text x="525" y="230" font-family="Courier New,Courier,monospace" font-size="11" fill="#374151" class="cline8" opacity="0">9</text>
    <text x="545" y="230" font-family="Courier New,Courier,monospace" font-size="11" fill="#94a3b8" class="cline8" opacity="0">    return</text>
    <text x="600" y="230" font-family="Courier New,Courier,monospace" font-size="11" fill="#86efac" class="cline8" opacity="0">"Build. Ship. Repeat."</text>

    <!-- Bottom status bar -->
    <rect x="510" y="276" width="356" height="24" rx="0" fill="#0a0f1e"/>
    <rect x="510" y="276" width="356" height="2" fill="#6366f1" opacity="0.5"/>
    <text x="525" y="292" font-family="Courier New,Courier,monospace" font-size="9" fill="#6366f1">Python</text>
    <text x="580" y="292" font-family="Courier New,Courier,monospace" font-size="9" fill="#475569">UTF-8</text>
    <text x="630" y="292" font-family="Courier New,Courier,monospace" font-size="9" fill="#475569">LF</text>
    <text x="676" y="292" font-family="Courier New,Courier,monospace" font-size="9" fill="#22c55e">● Ln 9, Col 32</text>

    <!-- Blinking cursor at end of last line -->
    <rect x="743" y="220" width="7" height="13" rx="1" fill="#6366f1" class="cursor"/>
  </g>

  <!-- Decorative orbit element (top-right) -->
  <g transform="translate(470, 50)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4,8"/>
    <circle cx="0" cy="-18" r="3" fill="#6366f1" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
