<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#divGlow)">
    <!-- Base Beam -->
    <line x1="40" y1="12" x2="860" y2="12" stroke="url(#divBeam)" stroke-width="1.8"/>
    <!-- Central Node Diamond -->
    <polygon points="450,7 455,12 450,17 445,12" fill="#ffffff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Secondary Dots -->
    <circle cx="350" cy="12" r="1.5" fill="#00f5ff"/>
    <circle cx="550" cy="12" r="1.5" fill="#a855f7"/>
  </g>
</svg>
