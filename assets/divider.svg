<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ffcc" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 12)">
    <line x1="20" y1="0" x2="860" y2="0" stroke="url(#divGrad)" stroke-width="1.8" filter="url(#divGlow)"/>
    <ellipse cx="440" cy="0" rx="25" ry="3.5" fill="#00ffcc" filter="url(#divGlow)"/>
    <circle cx="440" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>
