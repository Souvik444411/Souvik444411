<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#b026ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff00a0" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    @keyframes waveSway {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0); }
    }
    .wave-back {
      animation: waveSway 8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="880" height="130" fill="#080c16"/>

  <!-- Back Wave Curve -->
  <path class="wave-back" d="M -40 60 C 180 15, 360 85, 560 35 C 720 -5, 840 50, 920 30 L 920 130 L -40 130 Z" fill="url(#wave3)"/>

  <!-- Middle Wave Curve -->
  <path d="M 0 50 C 220 10, 440 75, 660 30 C 760 10, 840 45, 880 35 L 880 130 L 0 130 Z" fill="url(#wave2)"/>

  <!-- Foreground Wave Curve -->
  <path d="M 0 65 C 200 30, 420 85, 620 45 C 740 20, 820 60, 880 50 L 880 130 L 0 130 Z" fill="url(#wave1)" filter="url(#softShadow)"/>

  <!-- Centered Footer Text -->
  <g transform="translate(440, 98)" text-anchor="middle">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="3.5">
      THANKS FOR VISITING · KEEP BUILDING
    </text>
  </g>
</svg>
