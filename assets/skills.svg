<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>

    <!-- Bar fill gradients per category -->
    <linearGradient id="barAI"  x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barCV"  x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barWeb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="barWeb3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barAlgo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes growBar {
      from { width: 0; }
      to   { width: var(--w); }
    }
    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }
    .label { animation: fadeIn 0.5s ease both; }
    .bar-ai   { animation: growBar 1.4s cubic-bezier(.16,1,.3,1) 0.2s both; --w: 86%; width: 86%; }
    .bar-cv   { animation: growBar 1.4s cubic-bezier(.16,1,.3,1) 0.4s both; --w: 92%; width: 92%; }
    .bar-web  { animation: growBar 1.4s cubic-bezier(.16,1,.3,1) 0.6s both; --w: 78%; width: 78%; }
    .bar-web3 { animation: growBar 1.4s cubic-bezier(.16,1,.3,1) 0.8s both; --w: 70%; width: 70%; }
    .bar-algo { animation: growBar 1.4s cubic-bezier(.16,1,.3,1) 1.0s both; --w: 80%; width: 80%; }
  </style>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Section header -->
  <text x="40" y="44" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" fill="#374151" letter-spacing="2">// SKILLS_RADAR</text>
  <line x1="40" y1="54" x2="860" y2="54" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- ═══ LEFT — Skill Level Bars ═══ -->
  <g transform="translate(40, 72)" font-family="'Inter','Segoe UI',sans-serif">

    <!-- ROW: AI & Machine Learning -->
    <g transform="translate(0,0)" class="label" style="animation-delay:0.1s">
      <text y="13" font-size="12" fill="#c7d2fe" font-weight="600">AI &amp; Machine Learning</text>
      <text x="390" y="13" text-anchor="end" font-size="11" fill="#6366f1" font-family="'JetBrains Mono',monospace">86%</text>
      <rect x="0" y="20" width="390" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect class="bar-ai" x="0" y="20" height="7" rx="3.5" fill="url(#barAI)"/>
      <text x="410" y="29" font-size="10.5" fill="#475569" font-family="'JetBrains Mono',monospace">PyTorch · TensorFlow · Scikit-learn</text>
    </g>

    <!-- ROW: Computer Vision -->
    <g transform="translate(0,52)" class="label" style="animation-delay:0.2s">
      <text y="13" font-size="12" fill="#67e8f9" font-weight="600">Computer Vision</text>
      <text x="390" y="13" text-anchor="end" font-size="11" fill="#06b6d4" font-family="'JetBrains Mono',monospace">92%</text>
      <rect x="0" y="20" width="390" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect class="bar-cv" x="0" y="20" height="7" rx="3.5" fill="url(#barCV)"/>
      <text x="410" y="29" font-size="10.5" fill="#475569" font-family="'JetBrains Mono',monospace">OpenCV · MediaPipe · YOLO</text>
    </g>

    <!-- ROW: Full-Stack Web -->
    <g transform="translate(0,104)" class="label" style="animation-delay:0.3s">
      <text y="13" font-size="12" fill="#fda4af" font-weight="600">Full-Stack Web Dev</text>
      <text x="390" y="13" text-anchor="end" font-size="11" fill="#f43f5e" font-family="'JetBrains Mono',monospace">78%</text>
      <rect x="0" y="20" width="390" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect class="bar-web" x="0" y="20" height="7" rx="3.5" fill="url(#barWeb)"/>
      <text x="410" y="29" font-size="10.5" fill="#475569" font-family="'JetBrains Mono',monospace">React · Next.js · FastAPI · Node</text>
    </g>

    <!-- ROW: Web3 / Blockchain -->
    <g transform="translate(0,156)" class="label" style="animation-delay:0.4s">
      <text y="13" font-size="12" fill="#fde68a" font-weight="600">Web3 &amp; Blockchain</text>
      <text x="390" y="13" text-anchor="end" font-size="11" fill="#f59e0b" font-family="'JetBrains Mono',monospace">70%</text>
      <rect x="0" y="20" width="390" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect class="bar-web3" x="0" y="20" height="7" rx="3.5" fill="url(#barWeb3)"/>
      <text x="410" y="29" font-size="10.5" fill="#475569" font-family="'JetBrains Mono',monospace">Solidity · Ethereum · Truffle</text>
    </g>

    <!-- ROW: Algorithms & DSA -->
    <g transform="translate(0,208)" class="label" style="animation-delay:0.5s">
      <text y="13" font-size="12" fill="#86efac" font-weight="600">Algorithms &amp; DSA</text>
      <text x="390" y="13" text-anchor="end" font-size="11" fill="#22c55e" font-family="'JetBrains Mono',monospace">80%</text>
      <rect x="0" y="20" width="390" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect class="bar-algo" x="0" y="20" height="7" rx="3.5" fill="url(#barAlgo)"/>
      <text x="410" y="29" font-size="10.5" fill="#475569" font-family="'JetBrains Mono',monospace">C++ · Graph Theory · DP</text>
    </g>
  </g>

  <!-- ═══ RIGHT — Circular radar chart (pure SVG/CSS) ═══ -->
  <g transform="translate(760, 155)">
    <!-- Background rings -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>

    <!-- Axis lines (5 axes for 5 skills) -->
    <!-- AI: top -->
    <line x1="0" y1="0" x2="0"    y2="-90" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    <!-- CV: upper-right -->
    <line x1="0" y1="0" x2="85"   y2="-28" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    <!-- Web: lower-right -->
    <line x1="0" y1="0" x2="53"   y2="73"  stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    <!-- Web3: lower-left -->
    <line x1="0" y1="0" x2="-53"  y2="73"  stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
    <!-- Algo: upper-left -->
    <line x1="0" y1="0" x2="-85"  y2="-28" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>

    <!-- Radar polygon: values AI=86 CV=92 Web=78 Web3=70 Algo=80 scaled/90 -->
    <!-- Points (each axis * percentage, polar coords):
      AI   top     : (0, -90*0.86)         = (0, -77.4)
      CV   upper-R : (90*0.86*sin72°, -90*0.92*cos72°) ≈ (74.5, -25.6)
      Web  lower-R : (90*0.78*sin144°, -90*0.78*cos144°) ≈ (41.3, 56.9)
      Web3 lower-L : (-90*0.70*sin144°, -90*0.70*cos144°) ≈ (-37.1, 51.1)
      Algo upper-L : (-90*0.80*sin72°, -90*0.80*cos72°) ≈ (-68.6, -22.3)
    -->
    <polygon
      points="0,-77.4  74.5,-25.6  41.3,56.9  -37.1,51.1  -68.6,-22.3"
      fill="#6366f1"
      fill-opacity="0.15"
      stroke="#818cf8"
      stroke-width="1.5"
      stroke-opacity="0.7"
    />

    <!-- Axis labels -->
    <text x="0"   y="-96"  text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#c7d2fe">AI/ML</text>
    <text x="96"  y="-24"  text-anchor="start"  font-family="'JetBrains Mono',monospace" font-size="9" fill="#67e8f9">CV</text>
    <text x="60"  y="84"   text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fda4af">Web</text>
    <text x="-60" y="84"   text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fde68a">Web3</text>
    <text x="-96" y="-24"  text-anchor="end"    font-family="'JetBrains Mono',monospace" font-size="9" fill="#86efac">Algo</text>
  </g>
</svg>
