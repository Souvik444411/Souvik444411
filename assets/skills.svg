<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <!-- Bar fill gradients -->
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="b5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <!-- Shimmer for bars -->
    <linearGradient id="barShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Left Header -->
  <text x="24" y="34" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">// CORE_DOMAINS</text>
  <line x1="24" y1="44" x2="450" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Right Header -->
  <text x="685" y="34" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">// LIVE_BENCHMARKS</text>
  <line x1="510" y1="44" x2="860" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- Vertical separator -->
  <line x1="480" y1="20" x2="480" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- ══════════════════════════════════════════════
       LEFT SIDE: SKILL PROGRESS BARS (x=24 to x=450)
  ══════════════════════════════════════════════ -->

  <!-- ROW 0: AI & Machine Learning — 86% = 365px -->
  <g>
    <text x="24" y="75" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">AI &amp; Machine Learning</text>
    <text x="450" y="75" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#818cf8">86%</text>
    <rect x="24" y="83" width="426" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="83" width="366" height="7" rx="3.5" fill="url(#b1)">
      <animate attributeName="width" from="0" to="366" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="24" y="83" width="366" height="7" rx="3.5" fill="url(#barShimmer)"/>
    <text x="24" y="103" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#64748b">PyTorch · TensorFlow · Scikit-Learn · NumPy</text>
  </g>

  <!-- ROW 1: Computer Vision — 92% = 392px -->
  <g>
    <text x="24" y="122" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#67e8f9">Computer Vision</text>
    <text x="450" y="122" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f5ff">92%</text>
    <rect x="24" y="130" width="426" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="130" width="392" height="7" rx="3.5" fill="url(#b2)">
      <animate attributeName="width" from="0" to="392" dur="1.2s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="24" y="130" width="392" height="7" rx="3.5" fill="url(#barShimmer)"/>
    <text x="24" y="150" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#64748b">OpenCV · MediaPipe · YOLO · 21-Landmark Tracking</text>
  </g>

  <!-- ROW 2: Full-Stack Web Dev — 78% = 332px -->
  <g>
    <text x="24" y="169" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fda4af">Full-Stack Web Dev</text>
    <text x="450" y="169" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#f43f5e">78%</text>
    <rect x="24" y="177" width="426" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="177" width="332" height="7" rx="3.5" fill="url(#b3)">
      <animate attributeName="width" from="0" to="332" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="24" y="177" width="332" height="7" rx="3.5" fill="url(#barShimmer)"/>
    <text x="24" y="197" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#64748b">React · Next.js · FastAPI · Node.js · Tailwind</text>
  </g>

  <!-- ROW 3: Web3 & Blockchain — 70% = 298px -->
  <g>
    <text x="24" y="216" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde68a">Web3 &amp; Blockchain</text>
    <text x="450" y="216" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#f59e0b">70%</text>
    <rect x="24" y="224" width="426" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="224" width="298" height="7" rx="3.5" fill="url(#b4)">
      <animate attributeName="width" from="0" to="298" dur="1.2s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="24" y="224" width="298" height="7" rx="3.5" fill="url(#barShimmer)"/>
    <text x="24" y="244" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#64748b">Solidity · Ethereum · Truffle · Clarity (Stacks)</text>
  </g>

  <!-- ROW 4: Algorithms & DSA — 82% = 349px -->
  <g>
    <text x="24" y="263" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#86efac">Algorithms &amp; DSA</text>
    <text x="450" y="263" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#10b981">82%</text>
    <rect x="24" y="271" width="426" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="271" width="349" height="7" rx="3.5" fill="url(#b5)">
      <animate attributeName="width" from="0" to="349" dur="1.2s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="24" y="271" width="349" height="7" rx="3.5" fill="url(#barShimmer)"/>
    <text x="24" y="291" font-family="'Courier New', Courier, monospace" font-size="9.5" fill="#64748b">C++ · Graph Theory · Dynamic Programming · Trees</text>
  </g>

  <!-- ══════════════════════════════════════════════
       RIGHT SIDE: 3 RADIAL METRICS (cx = 560, 685, 810)
  ══════════════════════════════════════════════ -->
  <circle cx="685" cy="155" r="140" fill="url(#ringGlow)"/>

  <!-- Ring 1: ML Accuracy (cx=560, cy=150) -->
  <g transform="translate(560, 150)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="7"/>
    <!-- Circumference = 2 * PI * 42 = 263.89; 99.73% = 263.2 -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#b1)" stroke-width="7"
            stroke-dasharray="263.2 263.9" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 263.9" to="263.2 263.9" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </circle>
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#c7d2fe">99.7%</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8.5" font-weight="700" fill="#64748b">ML ACCURACY</text>
    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SignGesture AI</text>
    <text x="0" y="85" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#64748b">ASL Recognition</text>
  </g>

  <!-- Ring 2: DSA Challenge (cx=685, cy=150) -->
  <g transform="translate(685, 150)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="7"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#b5)" stroke-width="7"
            stroke-dasharray="263.9 263.9" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 263.9" to="263.9 263.9" dur="1.6s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </circle>
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#86efac">160d</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8.5" font-weight="700" fill="#64748b">STREAK</text>
    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">GFG Challenge</text>
    <text x="0" y="85" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#64748b">C++ Algorithms</text>
  </g>

  <!-- Ring 3: Computer Vision (cx=810, cy=150) -->
  <g transform="translate(810, 150)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1e293b" stroke-width="7"/>
    <!-- 92% = 242.8 -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#b2)" stroke-width="7"
            stroke-dasharray="242.8 263.9" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" from="0 263.9" to="242.8 263.9" dur="1.5s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </circle>
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#67e8f9">92%</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8.5" font-weight="700" fill="#64748b">CONFIDENCE</text>
    <text x="0" y="70" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">MediaPipe / CV</text>
    <text x="0" y="85" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="9" fill="#64748b">Real-Time Model</text>
  </g>
</svg>
