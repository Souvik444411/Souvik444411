<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Shimmer for bars -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes growW {
      from { width: 0; }
    }
    @keyframes pulse {
      0%,100% { opacity: 0.5; }
      50%     { opacity: 1; }
    }
    .c1 { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s both; }
    .c2 { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
    .c3 { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.4s both; }
    .c4 { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.55s both; }
    .bar { animation: growW 1.2s cubic-bezier(0.16,1,0.3,1) both; }
    .bar1 { animation-delay: 0.6s; }
    .bar2 { animation-delay: 0.75s; }
    .bar3 { animation-delay: 0.9s; }
    .bar4 { animation-delay: 1.05s; }
    .dot  { animation: pulse 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="880" height="420" fill="url(#bg)"/>
  <rect width="880" height="420" fill="url(#glow1)"/>
  <rect width="880" height="420" fill="url(#glow2)"/>

  <!-- Section header -->
  <text x="440" y="36" text-anchor="middle"
        font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" fill="#475569" letter-spacing="4">— FEATURED PROJECTS —</text>

  <!-- ══════════════════════════════════════════════
       CARD 1: SignGesture AI  (top-left: x=16,y=52, w=418, h=170)
  ══════════════════════════════════════════════ -->
  <g class="c1" opacity="0">
    <rect x="16" y="52" width="418" height="170" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="52" width="418" height="3" rx="12" fill="url(#indigo)"/>
    <!-- Card top accent bar -->
    <rect x="16" y="55" width="418" height="1" fill="url(#indigo)" opacity="0.3"/>

    <!-- Icon area -->
    <rect x="30" y="68" width="36" height="36" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="48" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle">🤟</text>

    <!-- Title -->
    <text x="76" y="78" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">SignGesture AI</text>
    <text x="76" y="96" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#475569">Python · OpenCV · MediaPipe · Scikit-learn</text>

    <!-- Description -->
    <text x="30" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Real-time ASL sign language recognition with two-way</text>
    <text x="30" y="136" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">translation bridge and offline TTS capability</text>

    <!-- Accuracy bar -->
    <text x="30" y="158" font-family="Courier New,Courier,monospace" font-size="10" fill="#6366f1">ML Accuracy</text>
    <text x="400" y="158" text-anchor="end" font-family="Courier New,Courier,monospace" font-size="10" fill="#a5b4fc" font-weight="700">99.73%</text>
    <rect x="30" y="162" width="380" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="30" y="162" width="379" height="5" rx="2.5" fill="url(#indigo)" class="bar bar1">
      <animate attributeName="width" from="0" to="379" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <rect x="30" y="162" width="379" height="5" rx="2.5" fill="url(#shimmer)" opacity="0.6"/>

    <!-- Link arrow -->
    <text x="400" y="92" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6366f1">↗ View</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 2: Decentralized KYC  (top-right: x=450,y=52, w=414, h=170)
  ══════════════════════════════════════════════ -->
  <g class="c2" opacity="0">
    <rect x="450" y="52" width="414" height="170" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="450" y="52" width="414" height="3" rx="12" fill="url(#cyan)"/>

    <!-- Icon area -->
    <rect x="464" y="68" width="36" height="36" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="482" y="90" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle">🔐</text>

    <!-- Title -->
    <text x="510" y="78" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Decentralized KYC</text>
    <text x="510" y="96" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#475569">Solidity · Ethereum · Web3.js · Smart Contracts</text>

    <!-- Description -->
    <text x="464" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Tamper-proof on-chain identity system eliminating</text>
    <text x="464" y="136" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">single-point-of-failure from KYC verification</text>

    <!-- Security bar -->
    <text x="464" y="158" font-family="Courier New,Courier,monospace" font-size="10" fill="#06b6d4">Security Level</text>
    <text x="834" y="158" text-anchor="end" font-family="Courier New,Courier,monospace" font-size="10" fill="#67e8f9" font-weight="700">On-Chain</text>
    <rect x="464" y="162" width="376" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="464" y="162" width="376" height="5" rx="2.5" fill="url(#cyan)" class="bar bar2">
      <animate attributeName="width" from="0" to="376" dur="1.2s" begin="0.75s" fill="freeze"/>
    </rect>

    <!-- Link arrow -->
    <text x="834" y="92" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#06b6d4">↗ View</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 3: GFG 160-Day DSA  (bottom-left: x=16,y=240, w=418, h=165)
  ══════════════════════════════════════════════ -->
  <g class="c3" opacity="0">
    <rect x="16" y="240" width="418" height="165" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="16" y="240" width="418" height="3" rx="12" fill="url(#rose)"/>

    <!-- Icon area -->
    <rect x="30" y="256" width="36" height="36" rx="8" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="48" y="278" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle">⚡</text>

    <!-- Title -->
    <text x="76" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">GFG 160-Day DSA</text>
    <text x="76" y="284" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#475569">C++ · Algorithms · Graphs · DP · Trees</text>

    <!-- Description -->
    <text x="30" y="308" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">160-day intensive challenge: graphs, dynamic programming,</text>
    <text x="30" y="324" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">tree traversal, greedy and divide-and-conquer algorithms</text>

    <!-- Progress bar -->
    <text x="30" y="348" font-family="Courier New,Courier,monospace" font-size="10" fill="#f43f5e">Progress</text>
    <text x="400" y="348" text-anchor="end" font-family="Courier New,Courier,monospace" font-size="10" fill="#fb7185" font-weight="700">160 Days</text>
    <rect x="30" y="352" width="380" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="30" y="352" width="380" height="5" rx="2.5" fill="url(#rose)" class="bar bar3">
      <animate attributeName="width" from="0" to="380" dur="1.2s" begin="0.9s" fill="freeze"/>
    </rect>

    <text x="400" y="284" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#f43f5e">↗ View</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 4: E-Commerce + NFT Manager  (bottom-right: x=450,y=240, w=414, h=165)
  ══════════════════════════════════════════════ -->
  <g class="c4" opacity="0">
    <rect x="450" y="240" width="414" height="165" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="450" y="240" width="414" height="3" rx="12" fill="url(#amber)"/>

    <!-- Icon area -->
    <rect x="464" y="256" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="482" y="278" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle">🛒</text>

    <!-- Title -->
    <text x="510" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">E-Commerce UI</text>
    <text x="510" y="284" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#475569">JavaScript · HTML · CSS · Responsive Design</text>

    <!-- Description -->
    <text x="464" y="308" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Amazon-style responsive storefront with dynamic cart,</text>
    <text x="464" y="324" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">product filtering, and seamless checkout flow</text>

    <!-- Progress bar -->
    <text x="464" y="348" font-family="Courier New,Courier,monospace" font-size="10" fill="#f59e0b">Completion</text>
    <text x="834" y="348" text-anchor="end" font-family="Courier New,Courier,monospace" font-size="10" fill="#fcd34d" font-weight="700">100%</text>
    <rect x="464" y="352" width="376" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="464" y="352" width="376" height="5" rx="2.5" fill="url(#amber)" class="bar bar4">
      <animate attributeName="width" from="0" to="376" dur="1.2s" begin="1.05s" fill="freeze"/>
    </rect>

    <text x="834" y="284" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#f59e0b">↗ View</text>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="395" width="880" height="25" fill="url(#bg)" opacity="0.8"/>
</svg>
