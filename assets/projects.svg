<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070d1e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Shimmer for bars -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)"/>
  <rect width="900" height="420" fill="url(#glow1)"/>
  <rect width="900" height="420" fill="url(#glow2)"/>

  <!-- Section Header -->
  <text x="450" y="32" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="12" font-weight="700" fill="#64748b" letter-spacing="3">// FEATURED_SYSTEMS</text>

  <!-- ══════════════════════════════════════════════
       CARD 1: SignGesture AI  (top-left: x=20,y=48, w=420, h=170)
  ══════════════════════════════════════════════ -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="420" height="170" rx="12" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="3" rx="12" fill="url(#indigo)"/>

    <!-- Icon Area -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="0.8"/>
    <text x="37" y="43" font-family="-apple-system, sans-serif" font-size="20" text-anchor="middle">🤟</text>

    <!-- Title & Stack -->
    <text x="68" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">SignGesture AI</text>
    <text x="68" y="50" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#818cf8">Python · OpenCV · MediaPipe · Scikit</text>

    <!-- Description -->
    <text x="18" y="78" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Two-way real-time ASL translation with 21 hand landmarks</text>
    <text x="18" y="96" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">and high-performance offline speech synthesis</text>

    <!-- Accuracy Bar -->
    <text x="18" y="126" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" fill="#818cf8">ML Accuracy</text>
    <text x="402" y="126" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="800" fill="#c7d2fe">99.73%</text>
    <rect x="18" y="132" width="384" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="18" y="132" width="383" height="7" rx="3.5" fill="url(#indigo)">
      <animate attributeName="width" from="0" to="383" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="18" y="132" width="383" height="7" rx="3.5" fill="url(#shimmer)"/>

    <text x="402" y="35" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8">↗ Inspect</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 2: Decentralized KYC  (top-right: x=460,y=48, w=420, h=170)
  ══════════════════════════════════════════════ -->
  <g transform="translate(460, 48)">
    <rect x="0" y="0" width="420" height="170" rx="12" fill="url(#cardBg)" stroke="#00f5ff" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="3" rx="12" fill="url(#cyan)"/>

    <!-- Icon Area -->
    <rect x="18" y="18" width="38" height="38" rx="8" fill="#00f5ff" fill-opacity="0.15" stroke="#00f5ff" stroke-width="0.8"/>
    <text x="37" y="43" font-family="-apple-system, sans-serif" font-size="20" text-anchor="middle">🔐</text>

    <!-- Title & Stack -->
    <text x="68" y="32" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Decentralized KYC</text>
    <text x="68" y="50" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#38bdf8">Solidity · Ethereum · Web3.js · Stacks</text>

    <!-- Description -->
    <text x="18" y="78" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Tamper-proof on-chain identity validation eliminating</text>
    <text x="18" y="96" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">single-point vulnerabilities in financial institutions</text>

    <!-- Security Level Bar -->
    <text x="18" y="126" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" fill="#00f5ff">Security Protocol</text>
    <text x="402" y="126" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="800" fill="#67e8f9">ON-CHAIN</text>
    <rect x="18" y="132" width="384" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="18" y="132" width="384" height="7" rx="3.5" fill="url(#cyan)">
      <animate attributeName="width" from="0" to="384" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="18" y="132" width="384" height="7" rx="3.5" fill="url(#shimmer)"/>

    <text x="402" y="35" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#00f5ff">↗ Inspect</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 3: GFG 160-Day DSA  (bottom-left: x=20,y=232, w=420, h=165)
  ══════════════════════════════════════════════ -->
  <g transform="translate(20, 232)">
    <rect x="0" y="0" width="420" height="165" rx="12" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="3" rx="12" fill="url(#rose)"/>

    <!-- Icon Area -->
    <rect x="18" y="16" width="38" height="38" rx="8" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="37" y="41" font-family="-apple-system, sans-serif" font-size="20" text-anchor="middle">⚡</text>

    <!-- Title & Stack -->
    <text x="68" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">GFG 160-Day DSA</text>
    <text x="68" y="48" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#fb7185">C++ · Graph Theory · DP · Trees</text>

    <!-- Description -->
    <text x="18" y="74" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">160-day sprint mastering competitive algorithmic puzzles,</text>
    <text x="18" y="92" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">dynamic programming optimization, and memory efficiency</text>

    <!-- Progress Bar -->
    <text x="18" y="122" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" fill="#f43f5e">Sprint Completion</text>
    <text x="402" y="122" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="800" fill="#fda4af">160 DAYS</text>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="url(#rose)">
      <animate attributeName="width" from="0" to="384" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="url(#shimmer)"/>

    <text x="402" y="33" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">↗ Inspect</text>
  </g>

  <!-- ══════════════════════════════════════════════
       CARD 4: E-Commerce UI + NFT Manager (bottom-right: x=460,y=232, w=420, h=165)
  ══════════════════════════════════════════════ -->
  <g transform="translate(460, 232)">
    <rect x="0" y="0" width="420" height="165" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="3" rx="12" fill="url(#amber)"/>

    <!-- Icon Area -->
    <rect x="18" y="16" width="38" height="38" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="37" y="41" font-family="-apple-system, sans-serif" font-size="20" text-anchor="middle">🛒</text>

    <!-- Title & Stack -->
    <text x="68" y="30" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">E-Commerce Web Suite</text>
    <text x="68" y="48" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#fbbf24">JavaScript · HTML5 · CSS3 · Responsive UI</text>

    <!-- Description -->
    <text x="18" y="74" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Interactive Amazon-style storefront with real-time cart,</text>
    <text x="18" y="92" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">instant catalog search, and smooth modular design</text>

    <!-- Progress Bar -->
    <text x="18" y="122" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="700" fill="#f59e0b">Build Status</text>
    <text x="402" y="122" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="800" fill="#fde68a">SHIPPED</text>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="url(#amber)">
      <animate attributeName="width" from="0" to="384" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <rect x="18" y="128" width="384" height="7" rx="3.5" fill="url(#shimmer)"/>

    <text x="402" y="33" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">↗ Inspect</text>
  </g>
</svg>
