<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <filter id="ghostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pacmanMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(380px); }
      100% { transform: translateX(0px); }
    }
    @keyframes ghostRedMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(360px); }
      100% { transform: translateX(0px); }
    }
    @keyframes ghostPinkMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(340px); }
      100% { transform: translateX(0px); }
    }
    @keyframes ghostCyanMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(320px); }
      100% { transform: translateX(0px); }
    }
    @keyframes mouthChomp {
      0%, 100% { d: path('M 0 0 L 10 -6 A 12 12 0 1 0 10 6 Z'); }
      50% { d: path('M 0 0 L 12 0 A 12 12 0 1 0 12 0.1 Z'); }
    }

    .pacman-unit {
      animation: pacmanMove 12s linear infinite;
    }
    .ghost-red {
      animation: ghostRedMove 12s linear infinite;
    }
    .ghost-pink {
      animation: ghostPinkMove 12s linear infinite;
    }
    .ghost-cyan {
      animation: ghostCyanMove 12s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="176" rx="12" fill="url(#gridBg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="4" y="4" width="872" height="172" rx="10" fill="none" stroke="#00f2fe" stroke-width="0.8" opacity="0.25"/>

  <!-- Month Timeline Header -->
  <g transform="translate(30, 24)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">
    <text x="0" y="0">Nov</text>
    <text x="70" y="0">Dec</text>
    <text x="140" y="0">Jan</text>
    <text x="210" y="0">Feb</text>
    <text x="280" y="0">Mar</text>
    <text x="350" y="0">Apr</text>
    <text x="420" y="0">May</text>
    <text x="490" y="0">Jun</text>
    <text x="560" y="0">Jul</text>
    <text x="630" y="0">Aug</text>
    <text x="700" y="0">Sep</text>
    <text x="770" y="0">Oct</text>
  </g>

