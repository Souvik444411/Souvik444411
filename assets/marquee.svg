<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="cg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#06b6d4"/>
      <stop offset="70%"  stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <style>
    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .track { animation: marquee 22s linear infinite; }
  </style>

  <rect width="900" height="90" fill="url(#bg)"/>

  <!-- Soft glow behind bar -->
  <line x1="0" y1="45" x2="900" y2="45" stroke="url(#cg1)" stroke-width="30" filter="url(#blur5)" opacity="0.3"/>
  <!-- The line itself -->
  <line x1="0" y1="45" x2="900" y2="45" stroke="url(#cg1)" stroke-width="1" opacity="0.4"/>

  <!-- Scrolling tech pill row -->
  <g class="track" transform="translate(0,27)">
    <!-- Duplicated set for seamless loop -->
    <g font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600">
      <!-- Set A -->
      <text x="0"   y="22" fill="#818cf8">Python</text>
      <text x="68"  y="22" fill="#374151">·</text>
